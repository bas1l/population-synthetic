name: "Regolo.ai Llama 3.1 70B — all_pick"

model_config:
  provider: "openai_compat"
  model: "meta-llama/Llama-3.1-70B-Instruct"
  base_url: "https://api.regolo.ai/v1"
  api_key_env_var: "REGOLO_API_KEY"
  generation_config:
    temperature: 0.7
    top_p: null
    max_output_tokens: 2048

parameters:
  mode: "configurable"
  config: "config/assets/identity/configurable/simulation_config_004_swedish_generative.json"
  strategy: "config/assets/identity/configurable/strategies/all_pick.json"
  log_llm: true
  output: "identity.json"
  parallel:
    n: 100
    workers: 1
    output_dir: "F:/liu-onedrive-nospecial-carac/_Teams/Gauss/02_Data/01_Raw/regolo_llama_all_pick"
  comparison_output_dir: "F:/liu-onedrive-nospecial-carac/_Teams/Gauss/02_Data/03_Analysis/regolo_llama_all_pick"
