name: "OVHcloud Llama 3.1 70B — all_pick"

model_config:
  provider: "openai_compat"
  model: "Meta-Llama-3_1-70B-Instruct"
  base_url: "https://llama-3-1-70b-instruct.endpoints.kepler.ai.cloud.ovh.net/api/openai_compat"
  api_key_env_var: "OVHCLOUD_AI_KEY"
  generation_config:
    temperature: 0.7
    top_p: null
    max_output_tokens: 2048

parameters:
  mode: "configurable"
  config: "config/assets/identity/configurable/simulation_config_004_swedish_generative.json"
  strategy: "config/assets/identity/configurable/strategies/all_pick.json"
  log_llm: true
  output: "identity.json"
  parallel:
    n: 100
    workers: 1
    output_dir: "F:/liu-onedrive-nospecial-carac/_Teams/Gauss/02_Data/01_Raw/ovhcloud_llama_all_pick"
  comparison_output_dir: "F:/liu-onedrive-nospecial-carac/_Teams/Gauss/02_Data/03_Analysis/ovhcloud_llama_all_pick"
