# ==============================================================================
# IDENTITY GENERATION MANIFEST — TEMPLATE
# ==============================================================================
# Copy this file and fill in the values to create a new manifest.
# Run with:
#   python scripts/generate/generate_identity.py --manifest config/synthetic/manifests/<your_manifest>.yaml
#   python scripts/generate/generate_identities_parallel.py --manifest config/synthetic/manifests/<your_manifest>.yaml
# ==============================================================================

# [MANDATORY] Human-readable name for this manifest.
name: "<Provider> <Model> — <strategy_shorthand>"

# ==============================================================================
# SECTION 1: MODEL CONFIGURATION
# ==============================================================================
model_config:
  # [MANDATORY] LLM provider. Valid: "gemini", "claude", "ollama"
  provider: "claude"

  # [MANDATORY] Model name.
  #   gemini defaults: "gemini-2.5-flash", "gemini-2.5-pro"
  #   claude defaults: "sonnet", "haiku"
  #   ollama examples: "llama3.1", "mistral", "qwen2.5"
  model: "haiku"

  # [OPTIONAL] Base URL for the Ollama server. Only used when provider is "ollama".
  # There is no default and no environment fallback: the endpoint normally comes from
  # the host registry (config/synthetic/ollama_hosts.yaml), selected per run with
  # --ollama-host (omitted: that file's default_host). Set this key only to pin an
  # ad-hoc endpoint that is not in the registry; an explicit --base-url overrides both.
  # base_url: "http://<host>:11434"

  # [OPTIONAL] Generation parameters passed to the LLM client.
  # For gemini: maps to GenerateContentConfig kwargs (temperature, top_p, etc.)
  # For claude: currently unused (ClaudeCodeClient does not expose gen params).
  # For ollama: maps to Ollama options (max_output_tokens -> num_predict).
  # Keys set to null are filtered out, allowing API defaults to apply.
  generation_config:
    temperature: null
    top_p: null
    top_k: null
    max_output_tokens: null

# ==============================================================================
# SECTION 2: GENERATION PARAMETERS
# ==============================================================================
parameters:
  # [MANDATORY] Generation mode. Valid: "configurable"
  mode: "configurable"

  # [MANDATORY] Path to the simulation config file. Relative to project root.
  config: "config/synthetic/simulation_configs/simulation_config_004_swedish_generative.json"

  # [CONDITIONAL] Path to the strategy definition file.
  # Required when mode is "configurable".
  strategy: "config/synthetic/axes/strategies/all_pick.yaml"

  # [OPTIONAL] Log raw LLM interactions alongside output. Default: true
  log_llm: true

  # [OPTIONAL] Output filename for single-identity generation. Default: "identity.json"
  output: "identity.json"

  # [OPTIONAL] Parallel generation settings (used by generate_identities_parallel.py).
  # Ignored by generate_identity.py.
  parallel:
    n: 100
    workers: 8
    output_dir: "data/identity/manifest_XXX"

  # [OPTIONAL] Output directory for comparison results (score_fidelity_sweden.py).
  # When set, comparison JSON/CSV/charts are written here instead of the default
  # data/analysis/compare_with_scb02/ path. Can be overridden by --output at runtime.
  comparison_output_dir: null
