name: "Mistral Large — all_pick"

model_config:
  provider: "openai_compat"
  model: "mistral-large-latest"
  base_url: "https://api.mistral.ai/v1"
  api_key_env_var: "MISTRAL_API_KEY"
  generation_config:
    temperature: 0.7
    top_p: null
    max_output_tokens: 2048

parameters:
  mode: "configurable"
  config: "config/synthetic/simulation_configs/simulation_config_004_swedish_generative.json"
  strategy: "config/synthetic/axes/strategies/all_pick.yaml"
  log_llm: true
  output: "identity.json"
  parallel:
    n: 100
    workers: 1
    output_dir: "F:/liu-onedrive-nospecial-carac/_Teams/Gauss/02_Data/01_Raw/mistral_large_all_pick"
  comparison_output_dir: "F:/liu-onedrive-nospecial-carac/_Teams/Gauss/02_Data/03_Analysis/mistral_large_all_pick"
