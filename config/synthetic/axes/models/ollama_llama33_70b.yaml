id: "ollama_llama33_70b"
label: "Ollama Llama3.3 70B (discarded for now)"
model_config:
  provider: "ollama"
  model: "llama3.3:70b-instruct-q4_K_M"
  # base_url removed -- the endpoint is a host property, chosen per run
  # (config/synthetic/ollama_hosts.yaml)
  generation_config:
    temperature: 0.7
    top_p: null
    top_k: null
    max_output_tokens: 2048
parameters:
  parallel:
    # Per-host worker count. A host absent from this map does not serve this model.
    # linux_3060: single slot only per docs/development/ollama-parallelism-poc/REPORT.md
    #   (weights exceed ~12GB VRAM => fully offloaded at ~0.8 tok/s, unusable on that box).
    workers:
      linux_3060: 1
