id: "ollama_llama31_8b"
label: "Ollama Llama3.1 8B"
model_config:
  provider: "ollama"
  model: "llama3.1:8b-instruct-q4_K_M"
  # base_url removed -- the endpoint is a host property, chosen per run
  # (config/synthetic/ollama_hosts.yaml)
  generation_config:
    temperature: 0.7
    top_p: null
    top_k: null
    max_output_tokens: 2048
parameters:
  parallel:
    # Per-host worker count. A host absent from this map does not serve this model.
    # linux_3060: VRAM-max knee per docs/development/ollama-parallelism-poc/REPORT.md
    #   (peak 2.15x). Only effective if that host's OLLAMA_NUM_PARALLEL matches;
    #   else requests queue.
    # windows_4070tis: VRAM-fit ceiling measured on the RTX 4070 Ti SUPER 16 GB
    #   (0.538 GB KV/slot; 826 MiB headroom at 16 slots, spills to CPU at 17).
    workers:
      linux_3060: 6
      windows_4070tis: 16
