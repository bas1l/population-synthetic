id: "ollama_llama32_3b"
label: "Ollama Llama3.2 3B (discarded for now)"
model_config:
  provider: "ollama"
  model: "llama3.2:3b-instruct-q4_K_M"
  # base_url removed -- the endpoint is a host property, chosen per run
  # (config/synthetic/ollama_hosts.yaml)
  generation_config:
    temperature: 0.7
    top_p: null
    top_k: null
    max_output_tokens: 2048
parameters:
  parallel:
    # Per-host worker count. A host absent from this map does not serve this model.
    # linux_3060: VRAM-max knee per docs/development/ollama-parallelism-poc/REPORT.md
    #   (peak 2.28x). Only effective if that host's OLLAMA_NUM_PARALLEL matches;
    #   else requests queue.
    workers:
      linux_3060: 10
