id: "all_generate_evaluate_pick"
family: "all_generate_evaluate_pick"
version: 1
label: "All Generate Evaluate Pick"
description: "All fields use generate_evaluate_pick method. LLM enumerates candidates, assigns probability weights, then picks one value from the candidates presented as value:probability pairs. 3 LLM calls per category (enumerate + evaluate + select); the select call sees each candidate with its weight, so the evaluate step informs the choice. Uses dependency DAG so prior resolved values are passed as context."
categories:
  age:                           { method: generate_evaluate_pick, depends_on: [] }
  biological_sex:                { method: generate_evaluate_pick, depends_on: [] }
  region:                        { method: generate_evaluate_pick, depends_on: [] }
  birth_location:                { method: generate_evaluate_pick, depends_on: [] }
  birth_country_detail:          { method: generate_evaluate_pick, depends_on: [birth_location] }
  civil_status:                  { method: generate_evaluate_pick, depends_on: [age, biological_sex] }
  household_size:                { method: generate_evaluate_pick, depends_on: [civil_status, age] }
  education_level:               { method: generate_evaluate_pick, depends_on: [age, biological_sex] }
  employment_status:             { method: generate_evaluate_pick, depends_on: [age, education_level, civil_status] }
  employment_type:               { method: generate_evaluate_pick, depends_on: [employment_status] }
  industry_sector:               { method: generate_evaluate_pick, depends_on: [employment_status] }
  socioeconomic_class:           { method: generate_evaluate_pick, depends_on: [employment_status, education_level] }
  income_source:                 { method: generate_evaluate_pick, depends_on: [employment_status, socioeconomic_class] }
  housing_tenure:                { method: generate_evaluate_pick, depends_on: [socioeconomic_class, civil_status] }
  parental_structure:            { method: generate_evaluate_pick, depends_on: [] }
  current_environment_type:      { method: generate_evaluate_pick, depends_on: [region] }
  ethnicity_broad_global_approx: { method: generate_evaluate_pick, depends_on: [birth_location] }
