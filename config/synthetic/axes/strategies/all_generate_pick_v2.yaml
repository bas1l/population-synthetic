id: "all_generate_pick_v2"
family: "all_generate_pick"
version: 2
label: "All Generate Pick (v2)"
description: "All fields use generate_pick method. LLM enumerates candidate values then picks one. 2 LLM calls per category (enumerate + select). Uses dependency DAG so prior resolved values are passed as context. v2: 14 categories aligned to the SCB scored axis set -- birth_location, ethnicity_broad_global_approx and current_environment_type are not generated. birth_country_detail now depends on age and biological_sex, mirroring the real SCB conditional chain."
categories:
  age:                   { method: generate_pick, depends_on: [] }
  biological_sex:        { method: generate_pick, depends_on: [] }
  region:                { method: generate_pick, depends_on: [] }
  birth_country_detail:  { method: generate_pick, depends_on: [age, biological_sex] }
  civil_status:          { method: generate_pick, depends_on: [age, biological_sex] }
  household_size:        { method: generate_pick, depends_on: [civil_status, age] }
  education_level:       { method: generate_pick, depends_on: [age, biological_sex] }
  employment_status:     { method: generate_pick, depends_on: [age, education_level, civil_status] }
  employment_type:       { method: generate_pick, depends_on: [employment_status] }
  industry_sector:       { method: generate_pick, depends_on: [employment_status] }
  socioeconomic_class:   { method: generate_pick, depends_on: [employment_status, education_level] }
  income_source:         { method: generate_pick, depends_on: [employment_status, socioeconomic_class] }
  housing_tenure:        { method: generate_pick, depends_on: [socioeconomic_class, civil_status] }
  parental_structure:    { method: generate_pick, depends_on: [] }
