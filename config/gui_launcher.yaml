default_action: generate_parallel

groups:
  - id: generate
    label: "Generate Population"
  - id: compare
    label: "Compare Population"

actions:
  - id: generate_one
    label: "LLM Single Identity"
    group: generate
    script: scripts/generate_identity.py
    requires_manifest: true
    parameters: []

  - id: generate_parallel
    label: "LLM Synthetic Population"
    group: generate
    script: scripts/generate_identities_parallel.py
    requires_manifest: true
    parameters:
      - key: n
        label: "Number of identities"
        type: int
        default: null
        default_from_manifest: parallel_n
        help: "How many identities to generate"
      - key: workers
        label: "Parallel workers"
        type: int
        default: 1
        default_from_manifest: parallel_workers
        help: "Number of parallel worker processes"
      - key: retry-until-success
        label: "Retry until success"
        type: bool
        default: false
        default_from_manifest: retry_until_success
        help: "Retry failed slots and LLM calls until all N succeed"

  - id: gen_db_pop
    label: "Database Population"
    group: generate
    script: scripts/generate_db_population.py
    requires_manifest: false
    parameters:
      - key: source
        label: "Data source"
        type: choice
        choices: ["scb", "ssb"]
        default: scb
        default_from_manifest: null
        help: "Statistical database to sample from (SCB = Sweden, SSB = Norway)"
      - key: n
        label: "Population size"
        type: int
        default: 1000
        default_from_manifest: null
        help: "Number of individuals to sample"
      - key: seed
        label: "Random seed"
        type: int
        default: 42
        default_from_manifest: null
        help: "RNG seed for reproducibility"
      - key: output
        label: "Output file"
        type: str
        default: population.json
        default_from_manifest: null
        help: "Output JSON file path"

  - id: extract_pop
    label: "Extract Population"
    group: generate
    script: scripts/extract_population_from_pipeline.py
    requires_manifest: true
    parameters:
      - key: seed-root
        label: "Seed root directory"
        type: str
        default: null
        default_from_manifest: null
        help: "Path to the seed output directory"
      - key: output
        label: "Output file"
        type: str
        default: pipeline_population.json
        default_from_manifest: null
        help: "Output JSON file path"

  - id: compare_scb
    label: "Pipeline vs Reference"
    group: compare
    script: scripts/compare_pipeline_to_scb.py
    requires_manifest: true
    parameters: []

  - id: compare_all
    label: "All Pipelines vs Reference"
    group: compare
    script: scripts/compare_all_pipelines.py
    requires_manifest: false
    parameters:
      - key: country
        label: "Country"
        type: choice
        choices: ["swedish"]
        default: swedish
        help: "Country axis ID to compare"
      - key: model
        label: "Model filter"
        type: str
        default: null
        help: "Comma-separated model IDs (blank = all)"
      - key: strategy
        label: "Strategy filter"
        type: str
        default: null
        help: "Comma-separated strategy IDs (blank = all)"
      - key: reference
        label: "Reference file"
        type: file
        default: null
        help: "SCB reference population JSON (blank = built-in default)"
      - key: no-charts
        label: "Skip charts"
        type: bool
        default: false
      - key: radar-tv-only
        label: "Radar: TV only"
        type: bool
        default: false

  - id: compare_pops
    label: "Compare Two Populations"
    group: compare
    script: scripts/compare_populations.py
    requires_manifest: false
    parameters:
      - key: pop_a
        label: "Population A"
        type: file
        default: null
        default_from_manifest: null
        help: "First population file"
      - key: pop_b
        label: "Population B"
        type: file
        default: null
        default_from_manifest: null
        help: "Second population file"
      - key: output
        label: "Output file"
        type: str
        default: null
        default_from_manifest: null
        help: "Output comparison report path"
