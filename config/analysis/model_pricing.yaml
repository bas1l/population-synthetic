# Per-model LLM pricing for the generation_metadata analysis.
#
# USD per 1,000,000 tokens. Cost = tokens * rate / 1e6.
# Keyed by the model AXIS id (the same id used in run slugs and
# discover_axis_values("models")), so the join to generation runs is exact.
#
# These figures are a static, dated snapshot -- not fetched live. Verify the
# rows flagged [VERIFY] before using cost figures in a publication, and confirm
# list-vs-effective pricing for the rows marked "effective/discounted".
observed_date: "2026-07-23"
source: "OpenRouter model pages + platform.claude.com pricing (see plan appendix)"
currency: "USD_per_1M_tokens"

# Prompt-cache pricing multipliers, applied to the per-model base INPUT rate.
# Standard Anthropic prompt caching: a cache READ costs ~0.1x base input, a cache
# WRITE (creation) ~1.25x base input. Cost adds:
#   cache_read_tokens  * in_rate * read  / 1e6
#   + cache_creation_tokens * in_rate * write / 1e6
# Only consulted when cache tokens are supplied; token-only cost is unchanged.
cache_multipliers:
  read: 0.1
  write: 1.25

models:
  # --- persona_realism judge models (RAW --model strings) ---
  # Keyed by the RAW model string passed to the judge CLI (`claude -p ... --model
  # claude-sonnet-5`), which is also the `judge_model` / `model_options` values in
  # config/analysis/persona_realism/judge.yaml. Unlike the generation rows below
  # (keyed by model AXIS id like `claude_sonnet`), the judge is not a generation-axis
  # model, so its cost lookup joins on the --model string directly via
  # persona_cost(judge_model, ...). One row per selectable judge dropdown model so
  # any choice prices correctly (fail-fast otherwise). Anthropic first-party rates.
  claude-sonnet-5:          {in: 3.00,  out: 15.00}   # Anthropic Sonnet 5 (LLM-as-judge default)
  claude-opus-4-8:          {in: 5.00,  out: 25.00}   # Anthropic Opus 4.8
  claude-haiku-4-5:         {in: 1.00,  out: 5.00}    # Anthropic Haiku 4.5
  claude-fable-5:           {in: 10.00, out: 50.00}   # Anthropic Fable 5 (slowest/most-expensive selectable option)
  claude_sonnet:            {in: 3.00,  out: 15.00}   # Anthropic first-party (Sonnet 5)
  claude_haiku:             {in: 1.00,  out: 5.00}    # Anthropic first-party (Haiku 4.5)
  claude_opus:              {in: 5.00,  out: 25.00}   # Anthropic first-party (Opus 4.8)
  gemini_flash:             {in: 0.30,  out: 2.50}    # google/gemini-2.5-flash (OpenRouter)
  openrouter_claude_sonnet5: {in: 3.00,  out: 15.00}   # anthropic/claude-sonnet-4-5
  openrouter_gpt55:          {in: 75.00, out: 150.00}  # openai/gpt-4.5-preview  [VERIFY: widget didn't render]
  openrouter_gemini_flash:   {in: 0.075, out: 0.30}    # google/gemini-flash-1.5 [VERIFY: legacy slug, unconfirmed]
  openrouter_deepseek_v4:    {in: 0.435, out: 0.87}    # deepseek/deepseek-v4-pro [effective/discounted]
  openrouter_glm_52:         {in: 0.77,  out: 2.42}    # z-ai/glm-5.2 [effective/discounted]
  openrouter_mistral_medium: {in: 1.50,  out: 7.50}    # mistralai/mistral-medium-3-5
  openrouter_qwen37_max:     {in: 1.475, out: 4.425}   # qwen/qwen3.7-max [effective/discounted]
  # --- local models: no API cost ---
  ollama_deepseek_r1_14b:   {in: 0, out: 0}
  ollama_gemma2_9b:         {in: 0, out: 0}
  ollama_gemma4_e4b:        {in: 0, out: 0}
  ollama_llama31_8b:        {in: 0, out: 0}
  ollama_llama32_3b:        {in: 0, out: 0}
  ollama_llama33_70b:       {in: 0, out: 0}
  ollama_lucie_7b:          {in: 0, out: 0}
  ollama_mistral_nemo_12b:  {in: 0, out: 0}
  ollama_qwen3_14b:         {in: 0, out: 0}
