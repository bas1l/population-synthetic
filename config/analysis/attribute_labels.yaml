# Attribute display labels -- the single source of truth for what a demographic
# attribute is CALLED on a published figure, table or axis tick.
#
# Why this file exists at all. The model and strategy axes already carry their own
# display text (`label:` / `display:` in each axis YAML), so the label resolver reads
# those in place and no second copy is kept. Attributes had no such field anywhere:
# the canonical names below are schema keys of the mapped population, and every
# renderer that needed to print one either printed the raw snake_case key or invented
# its own transformation. This file is that missing field, held once.
#
# Why it is country-agnostic and lives under config/analysis/ rather than beside the
# per-attribute mapping configs. The keys are the CANONICAL schema names shared by
# every mapping tier (config/mapping/{scb,scb_native,istat,ssb}/) -- the tiers differ
# in which raw values map onto an attribute, never in what the attribute is called.
# Putting a `label` in each tier's per-attribute JSON would make four copies of one
# string and let them drift; a country-specific rendering of a canonical attribute is
# not a thing this project has.
#
# Conventions (docs/development/plans/.../publication-figure-presentation-layer.md):
#   - Sentence case for the phrase, proper nouns preserved: "Housing tenure".
#   - No underscores. The resolver RAISES on a label containing one, so the
#     convention cannot rot silently.
#   - Every key present in any mapping tier's `_index.json` attributes must appear
#     here (asserted by tests/test_labels.py); a missing or empty label raises rather
#     than falling back to the raw key.
#
# The first block is the canonical mapped/comparison schema. The second is the raw
# generation categories that are not canonical attributes but are still printed by
# the raw-validation and generation-metadata figures.

labels:
  # Canonical comparison-schema attributes.
  age_group: "Age group"
  biological_sex: "Biological sex"
  education_level: "Education level"
  employment_status: "Employment status"
  birth_location: "Birth location"
  socioeconomic_class: "Socioeconomic class"
  parental_structure: "Parental structure"
  region: "Region"
  civil_status: "Civil status"
  industry_sector: "Industry sector"
  employment_type: "Employment type"
  housing_tenure: "Housing tenure"
  household_size: "Household size"
  income_source: "Income source"
  birth_country_detail: "Birth country"

  # Raw generation categories. `age` is the raw category that the mapping stage bins
  # into `age_group`; the last two are generated by the v1 strategies only and are
  # excluded from every scored axis, but still appear in raw-completeness figures.
  age: "Age"
  current_environment_type: "Environment type"
  ethnicity_broad_global_approx: "Broad ethnicity"
