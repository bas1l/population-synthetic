output_base: "F:/liu-onedrive-nospecial-carac/_Teams/Gauss/02_Data"

analytics:
  # Subdirectory under output_base where analysis results are written
  analysis_subdir: "03_Analysis"
  # Master folder under 03_Analysis; one subfolder per config combination (slug)
  # is nested inside it, e.g. 03_Analysis/run_analytics/{slug}/
  task_subdir: "run_analytics"
  # Default filename for the JSON analytics export (--output)
  json_filename: "run_analytics.json"
  # Default subdirectory name for per-run charts (--charts), relative to the slug dir
  charts_subdir: "charts"
  # Cross-run comparison output root (under the run_analytics master folder).
  # Underscore prefix keeps it distinct from run slugs.
  comparison_subdir: "_comparison"
  # Default verbosity
  verbose: false
