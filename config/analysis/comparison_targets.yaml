# comparison_targets.yaml -- completeness list consumed by scripts/analyze/map_populations.py
#
# This is the explicit list of synthetic populations we consider "complete" and want
# mapped for comparison. The map stage (map_populations.py) processes ONLY these
# targets; it does not scan disk for runs. Each mapped output lands under
# {output_base}/03_Analysis/mapped/.
#
# Each entry under `targets:` is EITHER:
#   - a plain string: a manifest path relative to the repo root. The country is
#     inferred from the manifest's simulation-config filename (infer_country).
#   - a mapping {manifest: <path>, country: <id>}: overrides country inference with
#     an explicit country id (must be a known id, e.g. swedish / italian).

targets:
  - config/synthetic/manifests/identity_manifest_022_claude_sonnet.yaml

  # Mapping form with explicit country override (example -- uncomment/adapt as needed):
  # - manifest: config/synthetic/manifests/identity_manifest_022_claude_sonnet.yaml
  #   country: swedish
