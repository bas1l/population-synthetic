# config/gui/v2/flows/generate_parallel.yaml
# options keys are CLI flag names; the GUI turns them into per-combo CLI args
# (the script does NOT read this file).
options:
  n: 100                     # --n
  workers: 8                 # --workers
  retry-until-success: false # --retry-until-success (flag when true)
selection:
  models: [claude_haiku, claude_opus, claude_sonnet, gemini_flash, 
      ollama_deepseek_r1_14b, ollama_gemma4_e4b, ollama_llama31_8b, 
      ollama_mistral_nemo_12b]
  strategies: [all_generate_evaluate_pick, all_generate_evaluate_random_pick, 
      all_generate_pick, all_pick, all_pick_dag]
  countries: [swedish]
force: false                 # generate flows only
