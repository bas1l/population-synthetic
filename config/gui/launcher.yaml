default_action: generate_parallel

groups:
  - id: generate
    label: "Generate Population"
  - id: analysis
    label: "Analysis"

actions:
  - id: generate_one
    label: "LLM Single Identity"
    group: generate
    script: scripts/generate/generate_identity.py
    requires_manifest: true
    parameters: []

  - id: generate_parallel
    label: "LLM Synthetic Population"
    group: generate
    script: scripts/generate/generate_identities_parallel.py
    requires_manifest: true
    parameters:
      - key: n
        label: "Number of identities"
        type: int
        default: 100
        default_from_manifest: parallel_n
        help: "How many identities to generate"
      - key: workers
        label: "Parallel workers"
        type: int
        default: 1
        default_from_manifest: parallel_workers
        help: "Number of parallel worker processes"
      - key: retry-until-success
        label: "Retry until success"
        type: bool
        default: false
        default_from_manifest: retry_until_success
        help: "Retry failed slots and LLM calls until all N succeed"

  - id: gen_db_pop
    label: "Database Population"
    group: generate
    script: scripts/generate/generate_db_population.py
    requires_manifest: false
    parameters:
      - key: source
        label: "Data source"
        type: choice
        choices: ["scb", "ssb"]
        default: scb
        default_from_manifest: null
        help: "Statistical database to sample from (SCB = Sweden, SSB = Norway)"
      - key: n
        label: "Population size"
        type: int
        default: 1000
        default_from_manifest: null
        help: "Number of individuals to sample"
      - key: seed
        label: "Random seed"
        type: int
        default: 42
        default_from_manifest: null
        help: "RNG seed for reproducibility"
      - key: output
        label: "Output file"
        type: str
        default: population.json
        default_from_manifest: null
        help: "Output JSON file path"

  - id: extract_pop
    label: "Extract Population"
    group: generate
    script: scripts/generate/extract_population_from_pipeline.py
    requires_manifest: true
    parameters:
      - key: seed-root
        label: "Seed root directory"
        type: str
        default: null
        default_from_manifest: null
        help: "Path to the seed output directory"
      - key: output
        label: "Output file"
        type: str
        default: pipeline_population.json
        default_from_manifest: null
        help: "Output JSON file path"

  - id: map_populations
    label: "Map Populations (run before Compare)"
    group: analysis
    script: scripts/analyze/map_populations.py
    requires_manifest: true
    axis_mode: per_combo
    parameters: []

  - id: compare_synth_real
    label: "Compare Synthetic to Real"
    group: analysis
    script: scripts/analyze/score_fidelity_all.py
    requires_manifest: false
    axis_mode: batch
    parameters:
      - key: no-charts
        label: "Skip charts"
        type: bool
        default: false
        help: "Skip chart generation"
      - key: radar-tv-only
        label: "Radar: TV only"
        type: bool
        default: false
        help: "On the radar chart, show only the TV-similarity polygon"

  - id: compare_pops
    label: "Compare Two Populations"
    group: analysis
    script: scripts/analyze/score_fidelity.py
    requires_manifest: false
    axis_mode: batch
    min_combos: 2
    max_combos: 2
    parameters:
      - key: output
        label: "Output file"
        type: str
        default: null
        default_from_manifest: null
        help: "Output comparison report path (blank = default)"
      - key: no-charts
        label: "Skip charts"
        type: bool
        default: false
        help: "Skip chart generation"

  - id: model_performance
    label: "Model Performance (models x methods)"
    group: analysis
    script: scripts/analyze/rank_models.py
    requires_manifest: false
    axis_mode: batch
    min_combos: 2
    parameters:
      - key: no-charts
        label: "Skip charts"
        type: bool
        default: false
        help: "Skip chart generation"
      - key: per-attribute-charts
        label: "Per-attribute charts"
        type: bool
        default: false
        help: "Also write one grouped bar chart per demographic attribute"
      - key: strict
        label: "Strict (fail on missing reports)"
        type: bool
        default: false
        help: "Fail when any selected combo lacks a comparison report"

  - id: llm_metrics_per_run
    label: "LLM Metrics (per-run)"
    group: analysis
    script: scripts/analyze/analyze_run.py
    requires_manifest: false
    axis_mode: per_combo
    parameters:
      - key: charts
        label: "Charts dir"
        type: str
        default: null
        help: "Write analytics charts here (blank = default)"
      - key: verbose
        label: "Verbose"
        type: bool
        default: false
        help: "Print per-persona breakdown after the run summary"

  - id: llm_metrics_cross_run
    label: "LLM Metrics (cross-run)"
    group: analysis
    script: scripts/analyze/compare_run_analytics.py
    requires_manifest: false
    axis_mode: batch
    parameters:
      - key: metrics
        label: "Metrics subset"
        type: str
        default: null
        help: "Space-separated metric keys (blank = all)"
