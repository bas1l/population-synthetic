# Analysis workflow DAG. The GUI walks tasks in dependency order and TRANSLATES
# each into CLI invocations of the task's script (scripts do NOT read this file).
# Task keys are the canonical analysis-registry ids: the label, description,
# script and dispatch are OWNED by config/analysis/analysis_registry.yaml and
# resolved through WorkflowConfigModel.get_task_meta -- they are NOT duplicated
# here. This file carries only GUI orchestration (enabled/bypass/force, options,
# depends_on, combo guards).
# dispatch (from the registry):
#   per_combo   -- one invocation per checked combo: --model-id/--strategy-id/--country-id
#   slugs       -- one invocation total, with one --slug {country}_{strategy}_{model} per combo
#   per_country -- one invocation per DISTINCT checked country: --country-id only
#                  (model/strategy ticks ignored -- real-population-only tasks)
tasks:
  validate_raw:                   # pipeline root -- per-combo raw-persona completeness check
    enabled: true
    bypass: false                 # assume already done -> unlock dependents, run nothing
    supports_force: true          # node shows a Force checkbox -> --force (overwrite CSV)
    force: false
    options:
      output-base:                # --output-base (blank = script default)
    depends_on: []

  mapping:                        # map the full validated raw pool (reads 01_Raw, not the cap)
    enabled: true
    bypass: false                 # assume already done -> unlock dependents, run nothing
    supports_force: true          # node shows a Force checkbox -> --force
    force: false
    options:
      output-base:                # --output-base (blank = script default)
    depends_on: [validate_raw]

  validate_mapped:                # per-combo mapped-persona check (unmapped-value detection)
    enabled: true
    bypass: false                 # assume already done -> unlock dependents, run nothing
    supports_force: true          # node shows a Force checkbox -> --force (overwrite CSV)
    force: false
    options:
      output-base:                # --output-base (blank = script default)
    depends_on: [mapping]

  population_cap:                 # seeded cap of each combo to N VALIDATED personas (runs last of the gate)
    enabled: true
    bypass: false                 # assume already done -> unlock dependents, run nothing
    supports_force: true          # node shows a Force checkbox -> --force (overwrite mirror)
    force: false
    options:
      n: '100'                    # --n (required; task raises if blank/missing)
      sample-seed: 0              # --sample-seed (int, reproducible draw)
      output-base:                # --output-base (blank = script default)
    depends_on: [validate_mapped]

  fidelity:
    enabled: true
    bypass: false                 # assume already done -> unlock dependents, run nothing
    supports_force: true          # node shows a Force checkbox -> --force
    force: false
    options:
      no-charts: false            # --no-charts (flag when true)
      radar-tv-only: false        # --radar-tv-only
      output-base:
      n-synthetic: '100'          # blank = no cap; integer = cap each population to this size
      sample-seed: 0              # seed for the without-replacement draw (reproducible)
    depends_on: [population_cap]

  multivariate_fidelity:
    enabled: false
    bypass: false                 # assume already done -> unlock dependents, run nothing
    supports_force: true          # node shows a Force checkbox -> --force
    force: false
    options:
      no-charts: false            # --no-charts
      output-base:                # blank = script default
      n-synthetic: '100'          # blank = no cap; integer = cap each population to this size
      sample-seed: 0              # seed for the without-replacement draw (reproducible)
    depends_on: [population_cap]

  consistency:
    enabled: false
    bypass: false                 # assume already done -> unlock dependents, run nothing
    supports_force: true
    force: false
    options:
      no-charts: false
      output-base:
    depends_on: [population_cap]

  model_ranking:
    enabled: true
    bypass: false                 # assume already done -> unlock dependents, run nothing
    min_combos: 2                 # guard: loud skip below 2 checked combos
    supports_force: true          # node shows a Force checkbox -> --force
    force: false
    options:
      no-charts: false
      per-attribute-charts: false
      strict: false
      output-base:
    depends_on: [fidelity]

  method_significance:
    enabled: true
    bypass: false                 # assume already done -> unlock dependents, run nothing
    min_combos: 2                 # guard: loud skip below 2 checked combos
    supports_force: true          # node shows a Force checkbox -> --force
    force: false
    options:
      no-charts: false
      strict: false
      output-base:
    depends_on: [fidelity]

  pairwise_comparison:
    enabled: false                # opt-in: needs EXACTLY 2 combos
    bypass: false                 # assume already done -> unlock dependents, run nothing
    min_combos: 2
    max_combos: 2
    supports_force: true          # node shows a Force checkbox -> --force
    force: false
    options:
      output:                     # --output (blank = script default)
      no-charts: false
    depends_on: [population_cap]

  real_population_stats:          # per_country dispatch -- real population only, ignores model/strategy
    enabled: true
    bypass: false                 # assume already done -> unlock dependents, run nothing
    supports_force: true          # node shows a Force checkbox -> --force
    force: false
    options: {}
    depends_on: [population_cap]

  generation_metadata:            # slugs dispatch -- LLM telemetry roll-up over the capped mirror
    enabled: true                 # ENABLED because cost_efficiency depends on its per-country
                                  # summary CSV. A disabled dependency is never marked complete,
                                  # so its dependents are dep-blocked and silently never run --
                                  # leaving this false would ship a cost_efficiency node that
                                  # cannot fire. An operator who has already run it can tick
                                  # `bypass` here instead of turning the node off.
    bypass: false                 # assume already done -> unlock dependents, run nothing
    supports_force: true          # node shows a Force checkbox -> --force
    force: false
    options:
      output-base:                # --output-base (blank = script default)
      no-charts: false            # --no-charts (flag when true; charts default ON)
    depends_on: [population_cap]

  persona_realism:                # per_combo dispatch -- LLM-as-judge per-persona coherence
    enabled: true                 # no min_combos: this task is strictly per-combination, so
                                  # one checked combo is a complete, valid unit of work. Each
                                  # invocation also enumerates its country's real_{country}
                                  # competitor (cheap once cached); the cross-combination
                                  # ranking is the separate realism_ranking node below.
    bypass: true                  # assume already done -> unlock dependents, run nothing
    supports_force: true          # node shows a Force checkbox -> --force (re-judge + re-write)
    force: false
    options:
      judge-model: claude-sonnet-5 # --judge-model (blank = config default claude-sonnet-5)
      sample:                     # --sample (blank = judge every synthetic persona; int caps per combo)
      real-sample: '100'          # --real-sample (blank = config default 100; caps the real_{country} competitor)
      rounds: '1'                 # --rounds (blank = config default n_rounds, currently 3)
      workers: '1'                # --workers (blank = config default fan-out width)
      rewrite-artifacts: true     # --rewrite-artifacts: rebuild the derived files from the
                                  # EXISTING verdict cache, zero LLM calls. This -- not Force --
                                  # is how to regenerate artifacts after an output-schema change.
      output-base:                # --output-base (blank = script default)
    depends_on: [population_cap]

  realism_ranking:                # slugs dispatch -- cross-combination ranking, no LLM work
    enabled: true                 # opt-in: needs >= 2 judged competitors to rank
    bypass: false                 # assume already done -> unlock dependents, run nothing
    min_combos: 2
    supports_force: true          # node shows a Force checkbox -> --force (recompute a country)
    force: false
    options:
      strict: false               # --strict (fail instead of skipping a non-consumable combo)
      min-combos: '2'             # --min-combos (a one-point ranking is not a ranking)
      rounds: '1'                 # --rounds (blank = the published artifacts, or the shallowest
                                  # cached depth when the set differs only on its round count; N
                                  # re-reduces every competitor over its first N cached rounds)
      no-charts: false            # --no-charts (flag when true; charts default ON)
      output-base:                # --output-base (blank = script default)
    depends_on: [persona_realism]

  validation_attrition:           # slugs dispatch -- re-reads the gate's own records, no LLM work
    enabled: true
    bypass: false                 # assume already done -> unlock dependents, run nothing
    supports_force: true          # node shows a Force checkbox -> --force (rewrite a country)
    force: false
    options:
      strict: false               # --strict (fail instead of skipping a combo missing from a validator roll-up)
      no-charts: false            # --no-charts (flag when true; charts default ON)
      output-base:                # --output-base (blank = script default)
    depends_on: [population_cap]

  cost_efficiency:                # slugs dispatch -- joins accuracy x cost, no LLM work
    enabled: true
    bypass: false                 # assume already done -> unlock dependents, run nothing
    supports_force: true          # node shows a Force checkbox -> --force (rewrite a country)
    force: false
    options:
      no-charts: false            # --no-charts (flag when true; charts default ON)
      output-base:                # --output-base (blank = script default)
    # Three declared inputs, all of them on-disk artifacts of other tasks: the fidelity
    # ranking's accuracy, the gate's attrition counts (the only artifact carrying the
    # WITHDRAWN combinations), and the generation-metadata telemetry roll-up. The plotted
    # cost itself is read from the full 01_Raw pool by this task, not from
    # generation_metadata's capped-mirror figures.
    depends_on: [model_ranking, generation_metadata, validation_attrition]

selection:                        # shared by ALL tasks in the chain
  models: [claude_haiku, claude_sonnet, ollama_deepseek_r1_14b, 
      ollama_gemma4_e4b, ollama_llama31_8b, ollama_mistral_nemo_12b, 
      openrouter_glm_52, openrouter_gpt56_sol, openrouter_gpt_oss_120b, 
      openrouter_kimi_k3, openrouter_mistral_medium, openrouter_opus_5, 
      openrouter_qwen35_flash]
  strategies: [all_generate_evaluate_pick_v2, 
      all_generate_evaluate_random_pick_v2, all_generate_pick_v2, 
      all_pick_dag_v2, all_pick_v2]
  countries: [swedish_02]
