# config/gui/flows/generate_parallel.yaml
# options keys are CLI flag names; the GUI turns them into per-combo CLI args
# (the script does NOT read this file).
options:
  n: 150                     # --n
  workers: 16                # --workers (applies to cloud combos; Ollama combos self-tune below)
  ollama-host: linux_3060    # --ollama-host: which Ollama endpoint serves the run. Host ids are
                             #   declared in config/synthetic/ollama_hosts.yaml (the dropdown is
                             #   built from that file). Inert for non-Ollama providers.
  ollama-auto-workers: true  # --ollama-auto-workers (flag when true): Ollama combos ignore
                             #   `workers` above and use the model axis file's
                             #   parallel.workers entry for the selected host
                             #   (VRAM-optimal per the parallelism POC). No-op for cloud providers.
  retry-until-success: true  # --retry-until-success (flag when true)
selection:
  models: [ollama_deepseek_r1_14b]
  strategies: [all_generate_evaluate_pick, all_generate_evaluate_random_pick, 
      all_generate_pick, all_pick, all_pick_dag]
  countries: [swedish_02]   # config_006 guided-prompt A/B run; baseline uses [swedish] (config_004)
force: false                 # generate flows only
