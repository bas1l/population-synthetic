# config/gui/flows/generate_parallel.yaml
# options keys are CLI flag names; the GUI turns them into per-combo CLI args
# (the script does NOT read this file).
options:
  n: 150                     # --n
  workers: 2                 # --workers (applies to cloud combos; Ollama combos self-tune below)
  ollama-host: windows_4070tis # --ollama-host: which Ollama endpoint serves the run. Host ids are
                             #   declared in config/synthetic/ollama_hosts.yaml (the dropdown is
                             #   built from that file). Inert for non-Ollama providers.
  ollama-auto-workers: true  # --ollama-auto-workers (flag when true): Ollama combos ignore
                             #   `workers` above and use the model axis file's
                             #   parallel.workers entry for the selected host
                             #   (VRAM-optimal per the parallelism POC). No-op for cloud providers.
  ollama-reconfigure: true   # --ollama-reconfigure (flag when true): before generating, set the
                             #   selected host's OLLAMA_NUM_PARALLEL to the worker count resolved
                             #   above and warm the model up. Pressing Run may therefore RESTART
                             #   that host's Ollama container, but only when the value differs:
                             #   a server already at the right value is read and left untouched,
                             #   so a multi-combo Run restarts at most once. Inert for non-Ollama
                             #   providers and for hosts declaring no control_url.
  retry-until-success: true  # --retry-until-success (flag when true): every retry layer
                             #   (HTTP transport, JSON parse, weight reconcile, persona slot)
                             #   retries up to 100 times instead of its small default of 3.
                             #   100 is a ceiling, not a target: a fatal provider error
                             #   (bad key, model not pulled) still aborts on the first
                             #   occurrence rather than consuming the budget.
selection:
  models: [claude_haiku, ollama_deepseek_r1_14b, ollama_gemma4_e4b, 
      ollama_llama31_8b, ollama_mistral_nemo_12b, openrouter_glm_52, 
      openrouter_gpt_oss_120b, openrouter_mistral_medium, 
      openrouter_qwen35_flash]
  strategies: [all_generate_evaluate_pick_v2, 
      all_generate_evaluate_random_pick_v2, all_generate_pick_v2, 
      all_pick_dag_v2, all_pick_v2]
  countries: [swedish_02]   # config_006 guided-prompt A/B run; baseline uses [swedish] (config_004)
force: false                 # generate flows only
